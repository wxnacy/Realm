<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- 指纹 -->
  <symbol id="realm-icon-fingerprint" viewBox="0 0 24 24">
    <path d="M2 12C2 6.5 6.5 2 12 2a10 10 0 0110 10" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M5 19.5C5.5 18 6 15 6 12c0-3.5 2.5-6 6-6 3.5 0 6 2.5 6 6 0 5-3 9-6 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M8 17c.5-1 1-3 1-5 0-2 1.5-3.5 3-3.5s3 1.5 3 3.5c0 3-2 7-4 9" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M11 15c0-1 .5-2 1-2s1 1 1 2c0 1.5-1 3-1 3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
  </symbol>

  <!-- 工作 -->
  <symbol id="realm-icon-briefcase" viewBox="0 0 24 24">
    <rect x="2" y="7" width="20" height="14" rx="2" stroke="currentColor" stroke-width="2" fill="none"/>
    <path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2" stroke="currentColor" stroke-width="2" fill="none"/>
  </symbol>

  <!-- 个人 -->
  <symbol id="realm-icon-user" viewBox="0 0 24 24">
    <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" stroke="currentColor" stroke-width="2" fill="none"/>
    <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2" fill="none"/>
  </symbol>

  <!-- 金融 -->
  <symbol id="realm-icon-bank" viewBox="0 0 24 24">
    <path d="M3 21h18M3 10h18M5 6l7-3 7 3" stroke="currentColor" stroke-width="2" fill="none"/>
    <path d="M4 10v11M8 10v11M12 10v11M16 10v11M20 10v11" stroke="currentColor" stroke-width="2" fill="none"/>
  </symbol>

  <!-- 游戏 -->
  <symbol id="realm-icon-game" viewBox="0 0 24 24">
    <rect x="2" y="6" width="20" height="12" rx="4" stroke="currentColor" stroke-width="2" fill="none"/>
    <path d="M8 12h0M16 12h0M12 8v0" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <path d="M6 12H4M12 12h0M12 12h0M12 12h0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <!-- 学习 -->
  <symbol id="realm-icon-book" viewBox="0 0 24 24">
    <path d="M4 19.5A2.5 2.5 0 016.5 17H20" stroke="currentColor" stroke-width="2" fill="none"/>
    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z" stroke="currentColor" stroke-width="2" fill="none"/>
  </symbol>

  <!-- 购物 -->
  <symbol id="realm-icon-cart" viewBox="0 0 24 24">
    <circle cx="9" cy="21" r="1" fill="currentColor"/>
    <circle cx="20" cy="21" r="1" fill="currentColor"/>
    <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6" stroke="currentColor" stroke-width="2" fill="none"/>
  </symbol>

  <!-- 财务 -->
  <symbol id="realm-icon-dollar" viewBox="0 0 24 24">
    <line x1="12" y1="1" x2="12" y2="23" stroke="currentColor" stroke-width="2"/>
    <path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6" stroke="currentColor" stroke-width="2" fill="none"/>
  </symbol>

  <!-- 家庭 -->
  <symbol id="realm-icon-home" viewBox="0 0 24 24">
    <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" stroke="currentColor" stroke-width="2" fill="none"/>
    <polyline points="9 22 9 12 15 12 15 22" stroke="currentColor" stroke-width="2" fill="none"/>
  </symbol>

  <!-- 邮件 -->
  <symbol id="realm-icon-mail" viewBox="0 0 24 24">
    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" stroke="currentColor" stroke-width="2" fill="none"/>
    <polyline points="22,6 12,13 2,6" stroke="currentColor" stroke-width="2" fill="none"/>
  </symbol>

  <!-- 科研 -->
  <symbol id="realm-icon-science" viewBox="0 0 24 24">
    <path d="M9 3v7.2L4.5 19.5A2 2 0 006.2 22h11.6a2 2 0 001.7-2.5L15 10.2V3" stroke="currentColor" stroke-width="2" fill="none"/>
    <line x1="9" y1="3" x2="15" y2="3" stroke="currentColor" stroke-width="2"/>
    <circle cx="10" cy="16" r="1" fill="currentColor"/>
    <circle cx="14" cy="14" r="1" fill="currentColor"/>
  </symbol>

  <!-- 音乐 -->
  <symbol id="realm-icon-music" viewBox="0 0 24 24">
    <path d="M9 18V5l12-2v13" stroke="currentColor" stroke-width="2" fill="none"/>
    <circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="2" fill="none"/>
    <circle cx="18" cy="16" r="3" stroke="currentColor" stroke-width="2" fill="none"/>
  </symbol>

  <!-- 手机 -->
  <symbol id="realm-icon-phone" viewBox="0 0 24 24">
    <rect x="5" y="2" width="14" height="20" rx="2" ry="2" stroke="currentColor" stroke-width="2" fill="none"/>
    <line x1="12" y1="18" x2="12.01" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <!-- 旅行 -->
  <symbol id="realm-icon-plane" viewBox="0 0 24 24">
    <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="currentColor" stroke-width="2" fill="none"/>
  </symbol>

  <!-- 设计 -->
  <symbol id="realm-icon-palette" viewBox="0 0 24 24">
    <circle cx="13.5" cy="6.5" r="0.5" fill="currentColor"/>
    <circle cx="17.5" cy="10.5" r="0.5" fill="currentColor"/>
    <circle cx="8.5" cy="7.5" r="0.5" fill="currentColor"/>
    <circle cx="6.5" cy="12.5" r="0.5" fill="currentColor"/>
    <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 011.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z" stroke="currentColor" stroke-width="2" fill="none"/>
  </symbol>

  <!-- 工具 -->
  <symbol id="realm-icon-wrench" viewBox="0 0 24 24">
    <path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z" stroke="currentColor" stroke-width="2" fill="none"/>
  </symbol>

  <!-- 数据 -->
  <symbol id="realm-icon-chart" viewBox="0 0 24 24">
    <line x1="18" y1="20" x2="18" y2="10" stroke="currentColor" stroke-width="2"/>
    <line x1="12" y1="20" x2="12" y2="4" stroke="currentColor" stroke-width="2"/>
    <line x1="6" y1="20" x2="6" y2="14" stroke="currentColor" stroke-width="2"/>
  </symbol>

  <!-- 公司 -->
  <symbol id="realm-icon-building" viewBox="0 0 24 24">
    <rect x="4" y="2" width="16" height="20" rx="2" ry="2" stroke="currentColor" stroke-width="2" fill="none"/>
    <line x1="9" y1="6" x2="9.01" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <line x1="15" y1="6" x2="15.01" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <line x1="9" y1="10" x2="9.01" y2="10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <line x1="15" y1="10" x2="15.01" y2="10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <line x1="9" y1="14" x2="9.01" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <line x1="15" y1="14" x2="15.01" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <line x1="9" y1="18" x2="15" y2="18" stroke="currentColor" stroke-width="2"/>
  </symbol>

  <!-- 目标 -->
  <symbol id="realm-icon-target" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none"/>
    <circle cx="12" cy="12" r="6" stroke="currentColor" stroke-width="2" fill="none"/>
    <circle cx="12" cy="12" r="2" stroke="currentColor" stroke-width="2" fill="none"/>
  </symbol>

  <!-- 隐私/安全 -->
  <symbol id="realm-icon-shield" viewBox="0 0 24 24">
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke="currentColor" stroke-width="2" fill="none"/>
  </symbol>
</svg>
