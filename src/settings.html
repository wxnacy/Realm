<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 页面经 http://localhost:PORT/settings 加载，base 使相对资源路径解析到 /settings/ 下 -->
  <base href="/settings/">
  <!-- img-src 需放行远程 favicon（http/https/data） -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: http: data:">
  <title>设置 - Realm</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div class="settings-page">
    <h1 class="settings-title">设置</h1>

    <!-- 默认浏览器设置 -->
    <div class="settings-group">
      <h3 class="settings-group-title">默认浏览器</h3>
      <div class="settings-item">
        <p class="settings-status" id="defaultBrowserStatus">检测中...</p>
        <button class="btn btn-primary" id="setDefaultBrowserBtn" style="display: none;">设为默认浏览器</button>
      </div>
    </div>

    <!-- 历史记录设置 -->
    <div class="settings-group">
      <h3 class="settings-group-title">历史记录</h3>
      <div class="settings-item">
        <label for="retentionDays">历史记录保留天数</label>
        <select class="settings-select" id="retentionDays">
          <option value="7">7 天</option>
          <option value="14">14 天</option>
          <option value="30">30 天</option>
          <option value="60">60 天</option>
          <option value="90">90 天</option>
          <option value="0">永不删除</option>
        </select>
      </div>
    </div>

    <!-- 默认容器设置 -->
    <div class="settings-group">
      <h3 class="settings-group-title">默认容器</h3>
      <div class="settings-item">
        <label for="defaultContainer">新标签页默认容器</label>
        <select class="settings-select" id="defaultContainer">
          <option value="default">使用上次打开的容器</option>
          <!-- 动态生成容器选项 -->
        </select>
      </div>
    </div>
  </div>

  <!-- Toast 提示 -->
  <div id="toast" class="toast hidden"></div>

  <script src="settings-page.js"></script>
</body>
</html>
