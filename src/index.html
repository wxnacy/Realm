<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- WR-7：渲染页面 CSP 纵深防御（webview 标签不受宿主页 CSP 约束，不影响浏览功能） -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'">
  <title>Realm Browser</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <!-- 侧边栏 - 容器列表 -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <span class="logo-icon">🌐</span>
        <span class="logo-text">Realm</span>
      </div>
      <button class="btn-icon" id="addContainerBtnSidebar" title="新建容器">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </div>

    <div class="container-list" id="containerList">
      <!-- 容器列表将由 JavaScript 动态生成 -->
    </div>

    <div class="sidebar-footer">
      <button class="btn-icon" id="settingsBtn" title="设置">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M12 1v6m0 6v6m11-7h-6m-6 0H1m15.36-5.36l-4.24 4.24m-2.24-2.24L5.64 5.64m12.72 12.72l-4.24-4.24m-2.24 2.24l-4.24 4.24"></path>
        </svg>
      </button>
    </div>
  </aside>

  <!-- 主内容区 -->
  <main class="main-content">
    <!-- Tab 栏 -->
    <div class="tab-bar" id="tabBar">
      <button class="tab-scroll-left tab-scroll-btn" id="tabScrollLeft" title="向左滚动">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 18l-6-6 6-6"></path>
        </svg>
      </button>
      <div class="tab-list" id="tabList">
        <!-- Tab 项将由 JavaScript 动态生成 -->
      </div>
      <button class="tab-scroll-right tab-scroll-btn" id="tabScrollRight" title="向右滚动">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 18l6-6-6-6"></path>
        </svg>
      </button>
      <button class="tab-new-btn" id="tabNewBtn" title="新建标签页">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </div>

    <!-- 工具栏 -->
    <div class="toolbar" id="toolbar">
      <div class="toolbar-left">
        <button class="btn-icon" id="backBtn" title="后退">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"></path>
          </svg>
        </button>
        <button class="btn-icon" id="forwardBtn" title="前进">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 12h14M12 5l7 7-7 7"></path>
          </svg>
        </button>
        <button class="btn-icon" id="reloadBtn" title="刷新">
          <svg class="icon-reload" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 4v6h-6M1 20v-6h6"></path>
            <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"></path>
          </svg>
          <svg class="icon-stop" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <div class="toolbar-center">
        <div class="container-indicator" id="containerIndicator">
          <span class="indicator-dot"></span>
          <span class="indicator-text">默认</span>
        </div>
        <input type="text" class="url-input" id="urlInput" placeholder="输入网址或搜索...">
      </div>

      <div class="toolbar-right">
        <button class="btn-icon" id="historyBtn" title="浏览历史">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
        </button>
        <button class="btn-icon" id="rulesBtn" title="分配规则">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
            <path d="M2 17l10 5 10-5"></path>
            <path d="M2 12l10 5 10-5"></path>
          </svg>
        </button>
        <button class="btn-icon" id="shortcutsBtn" title="快捷键设置">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect>
            <path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M8 12h.01M12 12h.01M16 12h.01M7 16h10"></path>
          </svg>
        </button>
        <button class="btn-icon" id="cookiesBtn" title="Cookie 管理">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <circle cx="12" cy="12" r="4"></circle>
            <line x1="21.17" y1="8" x2="12" y2="8"></line>
            <line x1="3.95" y1="6.06" x2="8.54" y2="14"></line>
            <line x1="10.88" y1="21.94" x2="15.46" y2="14"></line>
          </svg>
        </button>
      </div>
      <div class="loading-bar" id="loadingBar"></div>
    </div>

    <!-- 浏览器视图区域 -->
    <div class="browser-view" id="browserView">
      <!-- 新标签页 -->
      <div class="new-tab-page" id="newTabPage">
        <div class="new-tab-content">
          <h1 class="new-tab-title">新标签页</h1>
          <div class="new-tab-search-wrapper">
            <input type="text" class="new-tab-search" id="newTabSearch" placeholder="搜索或输入网址...">
          </div>
          <div class="new-tab-containers">
            <h2 class="new-tab-section-title">快速访问</h2>
            <div class="container-shortcuts" id="containerShortcuts">
              <!-- 容器快捷入口将由 JavaScript 动态生成 -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- 容器下拉面板 -->
  <div class="container-panel" id="containerPanel">
    <div class="panel-header">
      <span class="panel-title">容器列表</span>
      <button class="btn-icon" id="addContainerBtn" title="新建容器">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </div>
    <div class="panel-list" id="panelContainerList">
      <!-- 由 renderer.js 动态生成 -->
    </div>
  </div>

  <!-- 容器创建/编辑对话框 -->
  <dialog class="modal" id="containerModal">
    <div class="modal-content">
      <h2 id="containerModalTitle">新建容器</h2>
      <form id="containerForm">
        <div class="form-group">
          <label for="containerNameInput">容器名称</label>
          <input type="text" id="containerNameInput" required placeholder="例如：工作、个人、测试" maxlength="50">
          <div class="error-message" id="nameError"></div>
        </div>
        <div class="form-group">
          <label>容器颜色</label>
          <div class="color-picker" id="colorPicker">
            <button type="button" class="color-option" data-color="#3B82F6" style="background:#3B82F6"></button>
            <button type="button" class="color-option" data-color="#10B981" style="background:#10B981"></button>
            <button type="button" class="color-option" data-color="#F59E0B" style="background:#F59E0B"></button>
            <button type="button" class="color-option" data-color="#EF4444" style="background:#EF4444"></button>
            <button type="button" class="color-option" data-color="#8B5CF6" style="background:#8B5CF6"></button>
            <button type="button" class="color-option" data-color="#EC4899" style="background:#EC4899"></button>
            <button type="button" class="color-option" data-color="#6366F1" style="background:#6366F1"></button>
            <button type="button" class="color-option" data-color="#F97316" style="background:#F97316"></button>
          </div>
        </div>
        <div class="form-group">
          <label>容器图标</label>
          <div class="emoji-picker" id="emojiPicker">
            <button type="button" class="emoji-option" data-icon="🌐">🌐</button>
            <button type="button" class="emoji-option" data-icon="💼">💼</button>
            <button type="button" class="emoji-option" data-icon="👤">👤</button>
            <button type="button" class="emoji-option" data-icon="🏦">🏦</button>
            <button type="button" class="emoji-option" data-icon="🎮">🎮</button>
            <button type="button" class="emoji-option" data-icon="📚">📚</button>
            <button type="button" class="emoji-option" data-icon="🛒">🛒</button>
            <button type="button" class="emoji-option" data-icon="💰">💰</button>
            <button type="button" class="emoji-option" data-icon="🏠">🏠</button>
            <button type="button" class="emoji-option" data-icon="📧">📧</button>
            <button type="button" class="emoji-option" data-icon="🔬">🔬</button>
            <button type="button" class="emoji-option" data-icon="🎵">🎵</button>
            <button type="button" class="emoji-option" data-icon="📱">📱</button>
            <button type="button" class="emoji-option" data-icon="✈️">✈️</button>
            <button type="button" class="emoji-option" data-icon="🎨">🎨</button>
            <button type="button" class="emoji-option" data-icon="🔧">🔧</button>
            <button type="button" class="emoji-option" data-icon="📊">📊</button>
            <button type="button" class="emoji-option" data-icon="🏢">🏢</button>
            <button type="button" class="emoji-option" data-icon="🎯">🎯</button>
            <button type="button" class="emoji-option" data-icon="🌍">🌍</button>
          </div>
        </div>
        <hr class="form-divider">
        <div class="form-group">
          <label for="containerEmailInput">邮箱</label>
          <input type="email" id="containerEmailInput" placeholder="例如：user@example.com" maxlength="100">
          <div class="error-message" id="emailError"></div>
        </div>
        <div class="form-group">
          <label for="containerPhoneInput">手机号</label>
          <input type="tel" id="containerPhoneInput" placeholder="例如：13800138000" maxlength="11">
          <div class="error-message" id="phoneError"></div>
        </div>
        <div class="form-group">
          <label for="containerNotesInput">备注</label>
          <textarea id="containerNotesInput" placeholder="可选填写备注信息..." maxlength="500" rows="4"></textarea>
          <div class="error-message" id="notesError"></div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="cancelContainerBtn">取消</button>
          <button type="submit" class="btn btn-primary" id="saveContainerBtn">创建容器</button>
        </div>
      </form>
    </div>
  </dialog>

  <!-- 删除确认对话框 -->
  <dialog class="modal" id="deleteConfirmModal">
    <div class="modal-content">
      <h2>删除容器</h2>
      <div class="delete-confirm-content">
        <p>确定要删除以下容器吗？</p>
        <div class="container-preview" id="deleteContainerPreview">
          <!-- 动态填充容器信息 -->
        </div>
        <p class="warning-text">删除后该容器的 Cookie 和浏览数据将被清除</p>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" id="cancelDeleteBtn">取消</button>
        <button type="button" class="btn btn-danger" id="confirmDeleteBtn">删除</button>
      </div>
    </div>
  </dialog>

  <!-- Cookie 管理对话框 -->
  <dialog class="modal" id="cookiesModal">
    <div class="modal-content modal-large">
      <h2>Cookie 管理 - <span id="cookiesModalTitle">默认</span></h2>
      <div class="cookies-toolbar">
        <button class="btn btn-secondary" id="clearCookiesBtn">清除所有 Cookie</button>
        <button class="btn btn-secondary" id="refreshCookiesBtn">刷新</button>
      </div>
      <div class="cookies-list" id="cookiesList">
        <!-- Cookie 列表将由 JavaScript 动态生成 -->
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" id="closeCookiesModal">关闭</button>
      </div>
    </div>
  </dialog>

  <!-- 规则管理对话框 -->
  <dialog class="modal" id="rulesModal">
    <div class="modal-content modal-large">
      <h2>容器分配规则</h2>
      <div class="rules-toolbar">
        <div class="rule-form">
          <select id="ruleContainerSelect" class="select-input">
            <!-- 容器选项将由 JavaScript 动态生成 -->
          </select>
          <input type="text" id="rulePatternInput" class="text-input" placeholder="输入域名，如 google.com 或 *.google.com">
          <button class="btn btn-primary" id="addRuleBtn">添加规则</button>
        </div>
        <div class="rules-actions">
          <button class="btn btn-secondary" id="importRulesBtn">导入规则</button>
          <button class="btn btn-secondary" id="exportRulesBtn">导出规则</button>
        </div>
      </div>
      <div class="rules-list" id="rulesList">
        <!-- 规则列表将由 JavaScript 动态生成 -->
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" id="closeRulesModal">关闭</button>
      </div>
    </div>
  </dialog>

  <!-- 快捷键设置对话框 -->
  <dialog class="modal" id="shortcutsModal">
    <div class="modal-content modal-large">
      <h2>快捷键设置</h2>
      <div class="shortcuts-list" id="shortcutsList">
        <!-- 快捷键列表将由 JavaScript 动态生成 -->
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" id="closeShortcutsModal">关闭</button>
      </div>
    </div>
  </dialog>

  <!-- 快捷键捕获对话框（WR-5：window.prompt 在 Electron 中不受支持，改为按键捕获） -->
  <dialog class="modal" id="shortcutCaptureModal">
    <div class="modal-content">
      <h2 id="shortcutCaptureTitle">修改快捷键</h2>
      <div class="form-group">
        <label>请按下新的快捷键组合（Esc 取消）</label>
        <div class="key-capture-box" id="keyCaptureBox">等待按键...</div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" id="cancelKeyCaptureBtn">取消</button>
        <button type="button" class="btn btn-primary" id="saveKeyCaptureBtn" disabled>保存</button>
      </div>
    </div>
  </dialog>

  <script src="renderer.js"></script>
</body>
</html>
