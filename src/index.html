<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- WR-7：渲染页面 CSP 纵深防御（webview 标签不受宿主页 CSP 约束，不影响浏览功能） -->
  <!-- img-src 需放行 https:/http:：Tab favicon 来自任意网页源，被 CSP 拦截会显示为空白 -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; connect-src 'self'">
  <title>Realm Browser</title>
  <link rel="stylesheet" href="styles/main.css?v=2">
  <!-- AI 消息代码块语法高亮主题（highlight.js，配合 renderer.js 的 hljs.highlightElement） -->
  <link rel="stylesheet" href="../node_modules/highlight.js/styles/github-dark.min.css">
</head>
<body>
  <!-- 侧边栏 - 容器列表 -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <img class="logo-icon" src="../icons/icon.png" alt="Realm">
        <span class="logo-text">Realm</span>
      </div>
      <button class="btn-icon" id="addContainerBtnSidebar" title="新建容器">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </div>

    <div class="container-list" id="containerList">
      <!-- 容器列表将由 JavaScript 动态生成 -->
    </div>
  </aside>

  <!-- 主内容区 -->
  <main class="main-content">
    <!-- Tab 栏 -->
    <div class="tab-bar" id="tabBar">
      <button class="tab-scroll-left tab-scroll-btn" id="tabScrollLeft" title="向左滚动">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 18l-6-6 6-6"></path>
        </svg>
      </button>
      <div class="tab-list" id="tabList">
        <!-- Tab 项将由 JavaScript 动态生成 -->
      </div>
      <button class="tab-scroll-right tab-scroll-btn" id="tabScrollRight" title="向右滚动">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 18l6-6-6-6"></path>
        </svg>
      </button>
      <button class="tab-new-btn" id="tabNewBtn" title="新建标签页">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </div>

    <!-- 工具栏 -->
    <div class="toolbar" id="toolbar">
      <div class="toolbar-left">
        <button class="btn-icon" id="backBtn" title="后退">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"></path>
          </svg>
        </button>
        <button class="btn-icon" id="forwardBtn" title="前进">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 12h14M12 5l7 7-7 7"></path>
          </svg>
        </button>
        <button class="btn-icon" id="reloadBtn" title="刷新">
          <svg class="icon-reload" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 4v6h-6M1 20v-6h6"></path>
            <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"></path>
          </svg>
          <svg class="icon-stop" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <div class="toolbar-center">
        <div class="container-indicator" id="containerIndicator">
          <span class="indicator-dot"></span>
          <span class="indicator-text">默认</span>
        </div>
        <input type="text" class="url-input" id="urlInput" placeholder="输入网址或搜索...">
      </div>

      <div class="toolbar-right">
        <button class="btn-icon" id="bookmarkStarBtn" title="收藏">
          <svg class="star-outline" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
          <svg class="star-filled" width="18" height="18" viewBox="0 0 24 24" fill="#FBBF24" stroke="#FBBF24" stroke-width="2" style="display:none">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
        </button>
        <button class="btn-icon" id="historyBtn" title="浏览历史">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
        </button>
        <button class="btn-icon" id="favoritesBtn" title="收藏夹">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
        </button>
        <button class="btn-icon" id="cookiesBtn" title="Cookie 管理">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-1 0-.83.67-1.5 1.5-1.5H16c3.31 0 6-2.69 6-6 0-4.97-4.48-9-10-9z"></path>
            <circle cx="8.5" cy="11.5" r="1.5" fill="currentColor"></circle>
            <circle cx="14.5" cy="9.5" r="1.5" fill="currentColor"></circle>
            <circle cx="10" cy="16" r="1.5" fill="currentColor"></circle>
            <circle cx="16" cy="14.5" r="1" fill="currentColor"></circle>
            <circle cx="6" cy="15" r="1" fill="currentColor"></circle>
          </svg>
        </button>
        <button class="btn-icon" id="settingsBtn" title="设置">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
        <button class="btn-icon" id="aiPanelBtn" title="AI 助手">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2a4 4 0 0 1 4 4v1a4 4 0 0 1-8 0V6a4 4 0 0 1 4-4z"></path>
            <path d="M9 14h6"></path>
            <path d="M10 18h4"></path>
            <path d="M8 22h8a4 4 0 0 0 4-4v-1a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v1a4 4 0 0 0 4 4z"></path>
          </svg>
        </button>
      </div>
      <div class="loading-bar" id="loadingBar"></div>
    </div>

    <!-- 收藏栏 -->
    <div class="bookmarks-bar" id="bookmarksBar">
      <div class="bookmarks-bar-list" id="bookmarksBarList">
        <!-- JS 动态渲染收藏项 -->
      </div>
      <button class="bookmarks-overflow-btn" id="bookmarksOverflowBtn" title="更多书签">
        <span>»</span>
      </button>
    </div>

    <!-- 浏览器视图区域 -->
    <div class="browser-view" id="browserView">
      <!-- 新标签页 -->
      <div class="new-tab-page" id="newTabPage">
        <div class="new-tab-content">
          <h1 class="new-tab-title">新标签页</h1>
          <div class="new-tab-search-wrapper">
            <input type="text" class="new-tab-search" id="newTabSearch" placeholder="搜索或输入网址...">
          </div>
          <div class="new-tab-containers">
            <h2 class="new-tab-section-title">快速访问</h2>
            <div class="container-shortcuts" id="containerShortcuts">
              <!-- 容器快捷入口将由 JavaScript 动态生成 -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- 容器下拉面板 -->
  <div class="container-panel" id="containerPanel">
    <div class="panel-header">
      <span class="panel-title">容器列表</span>
      <button class="btn-icon" id="addContainerBtn" title="新建容器">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </div>
    <div class="panel-list" id="panelContainerList">
      <!-- 由 renderer.js 动态生成 -->
    </div>
  </div>

  <!-- 容器创建/编辑对话框 -->
  <dialog class="modal" id="containerModal">
    <div class="modal-content">
      <h2 id="containerModalTitle">新建容器</h2>
      <form id="containerForm">
        <div class="form-group">
          <label for="containerNameInput">容器名称</label>
          <input type="text" id="containerNameInput" required placeholder="例如：工作、个人、测试" maxlength="50">
          <div class="error-message" id="nameError"></div>
        </div>
        <div class="form-group">
          <label>容器颜色</label>
          <div class="color-picker" id="colorPicker">
            <button type="button" class="color-option" data-color="#3B82F6" style="background:#3B82F6"></button>
            <button type="button" class="color-option" data-color="#10B981" style="background:#10B981"></button>
            <button type="button" class="color-option" data-color="#F59E0B" style="background:#F59E0B"></button>
            <button type="button" class="color-option" data-color="#EF4444" style="background:#EF4444"></button>
            <button type="button" class="color-option" data-color="#8B5CF6" style="background:#8B5CF6"></button>
            <button type="button" class="color-option" data-color="#EC4899" style="background:#EC4899"></button>
            <button type="button" class="color-option" data-color="#6366F1" style="background:#6366F1"></button>
            <button type="button" class="color-option" data-color="#F97316" style="background:#F97316"></button>
          </div>
        </div>
        <div class="form-group">
          <label>容器图标</label>
          <div class="emoji-picker" id="emojiPicker">
            <button type="button" class="emoji-option" data-icon="🌐">🌐</button>
            <button type="button" class="emoji-option" data-icon="💼">💼</button>
            <button type="button" class="emoji-option" data-icon="👤">👤</button>
            <button type="button" class="emoji-option" data-icon="🏦">🏦</button>
            <button type="button" class="emoji-option" data-icon="🎮">🎮</button>
            <button type="button" class="emoji-option" data-icon="📚">📚</button>
            <button type="button" class="emoji-option" data-icon="🛒">🛒</button>
            <button type="button" class="emoji-option" data-icon="💰">💰</button>
            <button type="button" class="emoji-option" data-icon="🏠">🏠</button>
            <button type="button" class="emoji-option" data-icon="📧">📧</button>
            <button type="button" class="emoji-option" data-icon="🔬">🔬</button>
            <button type="button" class="emoji-option" data-icon="🎵">🎵</button>
            <button type="button" class="emoji-option" data-icon="📱">📱</button>
            <button type="button" class="emoji-option" data-icon="✈️">✈️</button>
            <button type="button" class="emoji-option" data-icon="🎨">🎨</button>
            <button type="button" class="emoji-option" data-icon="🔧">🔧</button>
            <button type="button" class="emoji-option" data-icon="📊">📊</button>
            <button type="button" class="emoji-option" data-icon="🏢">🏢</button>
            <button type="button" class="emoji-option" data-icon="🎯">🎯</button>
            <button type="button" class="emoji-option" data-icon="🌍">🌍</button>
          </div>
        </div>
        <hr class="form-divider">
        <div class="form-group">
          <label for="containerEmailInput">邮箱</label>
          <input type="email" id="containerEmailInput" placeholder="例如：user@example.com" maxlength="100">
          <div class="error-message" id="emailError"></div>
        </div>
        <div class="form-group">
          <label for="containerPhoneInput">手机号</label>
          <input type="tel" id="containerPhoneInput" placeholder="例如：13800138000" maxlength="11">
          <div class="error-message" id="phoneError"></div>
        </div>
        <div class="form-group">
          <label for="containerNotesInput">备注</label>
          <textarea id="containerNotesInput" placeholder="可选填写备注信息..." maxlength="500" rows="4"></textarea>
          <div class="error-message" id="notesError"></div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="cancelContainerBtn">取消</button>
          <button type="submit" class="btn btn-primary" id="saveContainerBtn">创建容器</button>
        </div>
      </form>
    </div>
  </dialog>

  <!-- 删除确认对话框 -->
  <dialog class="modal" id="deleteConfirmModal">
    <div class="modal-content">
      <h2>删除容器</h2>
      <div class="delete-confirm-content">
        <p>确定要删除以下容器吗？</p>
        <div class="container-preview" id="deleteContainerPreview">
          <!-- 动态填充容器信息 -->
        </div>
        <p class="warning-text">删除后该容器的 Cookie 和浏览数据将被清除</p>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" id="cancelDeleteBtn">取消</button>
        <button type="button" class="btn btn-danger" id="confirmDeleteBtn">删除</button>
      </div>
    </div>
  </dialog>

  <!-- 启动时恢复标签页询问对话框 -->
  <dialog class="modal" id="restoreTabsModal">
    <div class="modal-content">
      <h2>恢复上次的标签页？</h2>
      <div class="delete-confirm-content">
        <p>上次退出时有 <strong id="restoreTabsCount">0</strong> 个标签页未关闭。</p>
      </div>
      <div class="restore-tabs-footer">
        <label class="restore-tabs-remember">
          <input type="checkbox" id="restoreTabsRemember">
          <span>记住我的选择</span>
        </label>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="restoreTabsNoBtn">不恢复</button>
          <button type="button" class="btn btn-primary" id="restoreTabsYesBtn">恢复</button>
        </div>
      </div>
    </div>
  </dialog>

  <!-- Cookie 管理对话框 -->
  <dialog class="modal" id="cookiesModal">
    <div class="modal-content modal-xlarge">
      <h2>Cookie 管理 - <span id="cookiesModalTitle">默认</span></h2>

      <!-- 来源切换标签页 -->
      <div class="source-tabs">
        <button class="source-tab active" data-source="session">Session（实时）</button>
        <button class="source-tab" data-source="file">File（持久化）</button>
      </div>

      <!-- 域名过滤工具栏 -->
      <div class="domain-filter">
        <span class="filter-label">域名过滤：</span>
        <button class="filter-chip" data-filter="all">全部</button>
        <button class="filter-chip active" data-filter="subdomain">含子域名</button>
        <button class="filter-chip" data-filter="exact">仅当前域名</button>
        <button class="btn btn-secondary btn-sm" id="refreshCookiesBtn">刷新</button>
        <button class="btn btn-secondary btn-sm" id="saveCookiesBtn">保存到文件</button>
        <button class="btn btn-danger btn-sm" id="clearCookiesBtn">清除所有</button>
      </div>

      <!-- Cookie 列表头 -->
      <div class="cookie-list-header">
        <span class="cookie-col-name">Name</span>
        <span class="cookie-col-value">Value</span>
        <span class="cookie-col-domain">Domain</span>
        <span class="cookie-col-actions">操作</span>
      </div>

      <!-- Cookie 列表 -->
      <div class="cookies-list" id="cookiesList">
        <!-- Cookie 列表将由 JavaScript 动态生成 -->
      </div>

      <!-- 分页控件 -->
      <div class="pagination" id="cookiesPagination">
        <!-- 分页将由 JavaScript 动态生成 -->
      </div>

      <div class="form-actions">
        <button class="btn btn-primary" id="closeCookiesModal">关闭</button>
      </div>
    </div>
  </dialog>

  <!-- Cookie 编辑对话框 -->
  <dialog class="modal" id="cookieEditModal">
    <div class="modal-content cookie-edit-modal">
      <h2>编辑 Cookie</h2>
      <form id="cookieEditForm">
        <div class="form-group">
          <label for="cookieNameInput">Name</label>
          <input type="text" id="cookieNameInput" class="text-input" disabled>
        </div>
        <div class="form-group">
          <label for="cookieValueInput">Value</label>
          <input type="text" id="cookieValueInput" class="text-input">
        </div>
        <div class="form-group">
          <label for="cookieDomainInput">Domain</label>
          <input type="text" id="cookieDomainInput" class="text-input" disabled>
        </div>
        <div class="form-group">
          <label for="cookiePathInput">Path</label>
          <input type="text" id="cookiePathInput" class="text-input" value="/" disabled>
        </div>
        <div class="form-group">
          <label for="cookieExpirationInput">过期时间（Unix 时间戳）</label>
          <input type="text" id="cookieExpirationInput" class="text-input" placeholder="留空表示会话 Cookie">
        </div>
        <div class="form-row">
          <div class="form-group form-group-half">
            <label>
              <input type="checkbox" id="cookieSecureInput"> Secure
            </label>
          </div>
          <div class="form-group form-group-half">
            <label>
              <input type="checkbox" id="cookieHttpOnlyInput"> HttpOnly
            </label>
          </div>
        </div>
        <div class="form-group">
          <label for="cookieSameSiteInput">SameSite</label>
          <select id="cookieSameSiteInput" class="select-input">
            <option value="unspecified">Unspecified</option>
            <option value="no_restriction">No Restriction</option>
            <option value="lax">Lax</option>
            <option value="strict">Strict</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="cancelCookieEditBtn">取消</button>
          <button type="submit" class="btn btn-primary" id="saveCookieEditBtn">保存</button>
        </div>
      </form>
    </div>
  </dialog>

  <!-- 收藏编辑面板（dialog 元素 + showModal()，走 top layer 覆盖 webview） -->
  <dialog class="modal bookmark-edit-modal" id="bookmarkEditPanel">
    <div class="bookmark-edit-panel">
      <div class="bookmark-edit-header" id="bookmarkEditHeader">收藏此页面</div>
      <div class="bookmark-edit-field">
        <label for="bookmarkTitleInput">标题</label>
        <input type="text" id="bookmarkTitleInput" class="bookmark-edit-input" placeholder="页面标题">
      </div>
      <div class="bookmark-edit-field">
        <label>网址</label>
        <div id="bookmarkUrlDisplay" class="bookmark-edit-url"></div>
      </div>
      <div class="bookmark-edit-actions">
        <button type="button" class="btn btn-danger" id="bookmarkRemoveBtn" style="display:none">移除收藏</button>
        <button type="button" class="btn btn-secondary" id="bookmarkCancelBtn">取消</button>
        <button type="button" class="btn btn-primary" id="bookmarkSaveBtn">保存</button>
      </div>
    </div>
  </dialog>

  <!-- AI 助手面板（hidden：默认收起，CSS 设计中 .ai-panel:not(.hidden) 才展开） -->
  <div class="ai-panel hidden" id="aiPanel">
    <div class="ai-panel-header" id="aiPanelHeader">
      <span class="ai-panel-title">AI 助手</span>
      <div class="ai-panel-header-actions">
        <button class="btn-icon" id="aiSettingsBtn" title="AI 设置">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
