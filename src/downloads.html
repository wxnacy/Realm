<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/downloads/">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: http: data:">
  <title>下载内容 - Realm</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div class="downloads-page">
    <!-- 页面头部 -->
    <div class="downloads-page-header">
      <h1 class="downloads-page-title">下载内容</h1>
      <div class="downloads-page-actions">
        <button class="btn btn-danger" id="downloadsClearAllBtn">清空所有记录</button>
      </div>
    </div>

    <!-- 搜索栏 -->
    <div class="downloads-page-toolbar">
      <input type="text" class="downloads-search-input" placeholder="搜索下载记录..." id="downloadsSearchInput">
    </div>

    <!-- 批量操作栏（勾选时显示） -->
    <div class="downloads-actions-bar hidden" id="downloadsActionsBar">
      <span id="downloadsSelectedCount">已选择 0 项</span>
      <button id="downloadsDeleteSelectedBtn" class="btn btn-danger btn-sm">删除选中项</button>
      <button id="downloadsDeselectBtn" class="btn btn-secondary btn-sm">取消选择</button>
    </div>

    <!-- 下载列表 -->
    <div class="downloads-page-list" id="downloadsPageList">
      <!-- JS 动态渲染 -->
    </div>

    <!-- 空状态 -->
    <div class="downloads-empty-state hidden" id="downloadsEmptyState">
      <div class="download-empty-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </div>
      <div class="download-empty-title">暂无下载记录</div>
      <div class="download-empty-desc">点击网页中的下载链接开始下载</div>
    </div>

    <!-- 加载更多指示器 -->
    <div class="downloads-loading-more hidden" id="downloadsLoadingMore">
      <span>加载中...</span>
    </div>
  </div>

  <!-- 清空确认弹窗 -->
  <dialog class="download-clear-modal" id="downloadsClearModal">
    <div class="download-clear-modal-content">
      <div class="download-clear-modal-title">清空下载历史</div>
      <div class="download-clear-modal-desc">
        确定要清空所有下载记录吗？此操作不会删除已下载的文件。
      </div>
      <div class="download-clear-modal-actions">
        <button class="btn btn-secondary" id="downloadsClearCancelBtn">取消</button>
        <button class="btn btn-danger" id="downloadsClearConfirmBtn">清空所有</button>
      </div>
    </div>
  </dialog>

  <!-- 删除确认弹窗 -->
  <dialog class="download-delete-modal" id="downloadsDeleteModal">
    <div class="download-delete-modal-content">
      <div class="download-delete-modal-title">删除下载记录</div>
      <div class="download-delete-modal-desc" id="downloadsDeleteDesc">
        确定要删除此下载记录吗？
      </div>
      <label class="download-delete-checkbox">
        <input type="checkbox" id="downloadsDeleteFileCheckbox">
        <span>同时删除本地文件</span>
      </label>
      <div class="download-delete-modal-actions">
        <button class="btn btn-secondary" id="downloadsDeleteCancelBtn">取消</button>
        <button class="btn btn-danger" id="downloadsDeleteConfirmBtn">删除</button>
      </div>
    </div>
  </dialog>

  <script src="downloads-page.js"></script>
</body>
</html>
