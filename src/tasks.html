<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/tasks/">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: http: data:">
  <title>媒体任务 - Realm</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div class="tasks-page">
    <!-- 页面头部 -->
    <div class="downloads-page-header">
      <h1 class="downloads-page-title">媒体任务</h1>
    </div>

    <!-- 操作失败反馈条（G-44-9：textContent 写入、CSS 类初始隐藏、约 4s 自动消失） -->
    <div class="task-feedback hidden" id="taskFeedback" role="alert"></div>

    <!-- 三个分区初始 hidden（CSS 类，非内联 style）：首次 loadTasks 网络往返期间不得
         闪现空分区标题；loadTasks 返回后 renderZone 按有无任务 remove/add hidden -->
    <!-- 进行中 -->
    <section class="tasks-section hidden" id="tasksRunningSection">
      <h2 class="tasks-section-title">进行中</h2>
      <div class="tasks-zone-list" id="tasksRunningList"></div>
    </section>

    <!-- 已完成 -->
    <section class="tasks-section hidden" id="tasksCompletedSection">
      <h2 class="tasks-section-title">已完成</h2>
      <div class="tasks-zone-list" id="tasksCompletedList"></div>
    </section>

    <!-- 失败已中断 -->
    <section class="tasks-section hidden" id="tasksFailedSection">
      <h2 class="tasks-section-title">失败已中断</h2>
      <div class="tasks-zone-list" id="tasksFailedList"></div>
    </section>

    <!-- 空状态 -->
    <div class="downloads-empty-state hidden" id="tasksEmptyState">
      <div class="download-empty-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
        </svg>
      </div>
      <div class="download-empty-title">暂无媒体任务</div>
      <div class="download-empty-desc">直播录制和 MP4 转换任务会在这里显示进度</div>
    </div>
  </div>

  <script src="tasks-page.js"></script>
</body>
</html>
